on:
  push:

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Release artefacts are published for macOS and Windows too, so the platform
    # specific paths (`dunce`, `cmd.exe`/PowerShell previews, shell detection)
    # need to be built and tested rather than assumed.
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Run cargo build
        run: cargo build

      - name: Run cargo test
        run: cargo test

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y git bash fzf

      # The runner's system bash is 3.2, which lacks the substring syntax the
      # test harness uses.
      - name: Install dependencies
        if: runner.os == 'macOS'
        run: brew install bash fzf

      - name: Run bash tests
        if: runner.os != 'Windows'
        run: ./tests/run.sh

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
